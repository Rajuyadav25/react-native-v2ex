# Release Pipeline V1 lock portability config for ios/Podfile.lock (inspection-checklist §13A).
# The committed lock was generated at RECORDED_ROOT (CI run 37695094451); installs from two
# absolute paths gave byte-identical locks (runs 37695094451, 37696450043), so there are no ENTRY
# lines and any lock or tracked-file change after pod install fails closed.
LOCK_FILE=ios/Podfile.lock
RECORDED_ROOT=/Users/runner/work/react-native-v2ex/react-native-v2ex
ENTRY_PATTERN=  {name}: ([0-9a-f]{40})
HASH_ALGORITHM=sha1
